name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Build includes the tsc project check; tests:verify replays the committed
      # golden fixtures (tools/tests-import/fixtures/) against the scoring
      # engine — no tests_app clone involved.
      - run: npm ci
      - run: npm run build
      - run: npm run tests:verify
      # Блокирующий набор робота (этап 4, 05.08.2026): L0 структура тестов
      # против audit-baseline.json, L0.5 линт весов (классы A/B/E) против
      # lint-baseline.json, L3 — инварианты обоих LLM-фидов на golden-фикстурах
      # (esbuild компилирует настоящие билдеры из supabase/functions/_shared).
      - run: npm run tests:audit
      - run: npm run tests:lint
      - run: npm run tests:feed-invariants
      # K1a: редакторский слой каталога (src/tests/merchandising.json) пишется
      # руками, а сам каталог генерируется — расходятся они молча, поэтому
      # проверка блокирующая.
      - run: npm run tests:merch
