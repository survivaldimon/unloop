name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Build includes the tsc project check; tests:verify replays the committed
      # golden fixtures (tools/tests-import/fixtures/) against the scoring
      # engine — no tests_app clone involved.
      - run: npm ci
      - run: npm run build
      - run: npm run tests:verify
