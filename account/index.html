<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Account — Looplore</title>
    <meta name="description" content="Your Looplore balance, credit history and past reads." />
    <!-- Not a landing page: it is where sign-in links and password resets come
         back to, and it has nothing to offer a search result. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#151110" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body style="background:#151110">
    <div id="root">
      <style>
        @keyframes ll-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      </style>
      <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#151110">
        <span style="font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:0.42em;color:#f2ead9;animation:ll-pulse 1.6s ease-in-out infinite">LOOPLORE</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
